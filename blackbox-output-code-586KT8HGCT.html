<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Harga Rupiah Real-Time</title>
    <!-- Mengambil Library Chart.js untuk menampilkan grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent-green: #00c853;
            --accent-red: #d50000;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
        }

        .last-updated {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* Tampilan Kartu Mata Uang */
        .rates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .currency-pair {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .price {
            font-size: 2rem;
            font-weight: bold;
            margin: 0;
        }

        .status {
            font-size: 0.8rem;
            margin-top: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: grey;
        }

        /* Bagian Chart */
        .chart-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            height: 400px;
            position: relative;
        }

        /* Loading State */
        .loading {
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
        }

        @media (max-width: 600px) {
            .chart-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Kurs Rupiah Real-Time</h1>
            <div class="last-updated">Mengambil data dari API publik...</div>
        </header>

        <!-- Tempat Menampilkan Harga -->
        <div class="rates-grid">
            <!-- USD -->
            <div class="card">
                <div class="currency-pair">USD / IDR</div>
                <p class="price" id="usd-price">Loading...</p>
                <div class="status">
                    <div class="dot" id="usd-dot"></div>
                    <span id="usd-text">-</span>
                </div>
            </div>

            <!-- EUR -->
            <div class="card">
                <div class="currency-pair">EUR / IDR</div>
                <p class="price" id="eur-price">Loading...</p>
                <div class="status">
                    <div class="dot" id="eur-dot"></div>
                    <span id="eur-text">-</span>
                </div>
            </div>

            <!-- SGD -->
            <div class="card">
                <div class="currency-pair">SGD / IDR</div>
                <p class="price" id="sgd-price">Loading...</p>
                <div class="status">
                    <div class="dot" id="sgd-dot"></div>
                    <span id="sgd-text">-</span>
                </div>
            </div>
             <!-- MYR -->
             <div class="card">
                <div class="currency-pair">MYR / IDR</div>
                <p class="price" id="myr-price">Loading...</p>
                <div class="status">
                    <div class="dot" id="myr-dot"></div>
                    <span id="myr-text">-</span>
                </div>
            </div>
        </div>

        <!-- Tempat Menampilkan Grafik -->
        <div class="chart-container">
            <canvas id="rupiahChart"></canvas>
        </div>
        
        <div class="loading" id="loading-message"></div>
    </div>

    <script>
        // Konfigurasi Chart
        const ctx = document.getElementById('rupiahChart').getContext('2d');
        let chart;
        
        // Data sementara untuk history chart (maksimal 20 titik agar tidak terlalu berat)
        let chartLabels = [];
        let chartData = [];

        // Inisialisasi Chart Kosong
        function initChart() {
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: 'Harga USD terhadap IDR (Rupiah)',
                        data: chartData,
                        borderColor: '#00c853',
                        backgroundColor: 'rgba(0, 200, 83, 0.1)',
                        borderWidth: 2,
                        tension: 0.4, // Membuat garis sedikit lengkung
                        fill: true,
                        pointRadius: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            grid: { color: '#333' },
                            ticks: { color: '#b0b0b0' }
                        },
                        x: {
                            grid: { color: '#333' },
                            ticks: { display: false } // Sembunyikan label x yang terlalu banyak
                        }
                    },
                    plugins: {
                        legend: {
                            labels: { color: '#fff' }
                        }
                    }
                }
            });
        }

        initChart();

        // Fungsi Mengambil Data dari API
        // Menggunakan API Gratis: exchangerate-api (Base USD)
        async function fetchData() {
            const url = 'https://api.exchangerate-api.com/v4/latest/USD';
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                // Rates terhadap USD (Contoh: 1 USD = 16000 IDR)
                const rates = data.rates;
                const timestamp = new Date().toLocaleTimeString();

                updateUI(rates, timestamp);
                
                // Update Chart
                updateChart(rates['IDR'], timestamp);

                document.querySelector('.last-updated').innerText = `Terakhir diperbarui: ${timestamp}`;
                document.getElementById('loading-message').innerText = '';

            } catch (error) {
                console.error('Gagal mengambil data:', error);
                document.getElementById('loading-message').innerText = 'Gagal memuat data. Memeriksa koneksi...';
            }
        }

        // Fungsi Memperbarui Tampilan Teks
        function updateUI(rates, time) {
            const currencies = ['IDR', 'EUR', 'SGD', 'MYR'];
            
            currencies.forEach(curr => {
                const priceElement = document.getElementById(`${curr.toLowerCase()}-price`);
                const dotElement = document.getElementById(`${curr.toLowerCase()}-dot`);
                
                if (priceElement) {
                    let value = rates[curr];
                    
                    // Format angka agar mudah dibaca (Titik untuk ribuan)
                    if(curr === 'IDR') {
                        value = value.toLocaleString('id-ID');
                    } else {
                        value = value.toLocaleString('id-ID', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                    }

                    priceElement.innerText = value;

                    // Efek Visual Sederhana (Hijau jika baik/naik, abu-abu untuk netral)
                    // Karena ini kurs, logika naik/turun relatif terhadap USD. 
                    // Untuk sederhana, kita buat efek kedipan warna saja tanpa logika naik_turun_complex di demo ini
                    dotElement.style.backgroundColor = '#00c853';
                    setTimeout(() => { dotElement.style.backgroundColor = 'grey'; }, 500);
                }
            });
        }

        // Fungsi Memperbarui Chart
        function updateChart(newValue, label) {
            // Batasi hanya 20 data point terakhir
            if (chartLabels.length > 20) {
                chartLabels.shift();
                chartData.shift();
            }

            chartLabels.push(label);
            chartData.push(newValue);

            chart.update();
        }

        // Jalankan pertama kali saat halaman dimuat
        fetchData();

        // Auto-refresh setiap 10 detik (10000 ms)
        setInterval(fetchData, 10000);

    </script>
</body>
</html>
